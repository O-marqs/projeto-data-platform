services:
  control-db:
    image: postgres:${CONTROL_POSTGRES_VERSION:-18.6}@${CONTROL_POSTGRES_IMAGE_DIGEST:-sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae}
    ports:
      - "127.0.0.1:${CONTROL_DB_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${CONTROL_DB_NAME:-control_db}
      POSTGRES_USER: ${CONTROL_DB_USER:-control_user}
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD:-change-me-control-password}
    volumes:
      - control_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20

  control-migrate:
    build:
      context: ../../..
      dockerfile: apps/control-plane-api/Dockerfile
    environment:
      CONTROL_APP_ENV: ${CONTROL_APP_ENV:-local}
      CONTROL_LOG_LEVEL: ${CONTROL_LOG_LEVEL:-INFO}
      CONTROL_DATABASE_URL: postgresql+psycopg://${CONTROL_DB_USER:-control_user}:${CONTROL_DB_PASSWORD:-change-me-control-password}@control-db:5432/${CONTROL_DB_NAME:-control_db}
      CONTROL_REQUIRED_MIGRATION_REVISION: 0004_connection_public_schema
    depends_on:
      control-db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  control-api:
    build:
      context: ../../..
      dockerfile: apps/control-plane-api/Dockerfile
    ports:
      - "127.0.0.1:${CONTROL_API_HOST_PORT:-8000}:8000"
    environment:
      CONTROL_APP_ENV: ${CONTROL_APP_ENV:-local}
      CONTROL_LOG_LEVEL: ${CONTROL_LOG_LEVEL:-INFO}
      CONTROL_DATABASE_URL: postgresql+psycopg://${CONTROL_DB_USER:-control_user}:${CONTROL_DB_PASSWORD:-change-me-control-password}@control-db:5432/${CONTROL_DB_NAME:-control_db}
      CONTROL_REQUIRED_MIGRATION_REVISION: 0004_connection_public_schema
      VAULT_ADDR: ${VAULT_ADDR:-http://host.docker.internal:18200}
      VAULT_APPROLE_MOUNT: ${VAULT_APPROLE_MOUNT:-approle}
      VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-pdp}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      control-migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  control-api-test:
    profiles: ["test"]
    build:
      context: ../../..
      dockerfile: apps/control-plane-api/Dockerfile
    environment:
      CONTROL_APP_ENV: ${CONTROL_APP_ENV:-local}
      CONTROL_LOG_LEVEL: ${CONTROL_LOG_LEVEL:-INFO}
      CONTROL_DATABASE_URL: postgresql+psycopg://${CONTROL_DB_USER:-control_user}:${CONTROL_DB_PASSWORD:-change-me-control-password}@control-db:5432/${CONTROL_DB_NAME:-control_db}
      CONTROL_REQUIRED_MIGRATION_REVISION: 0004_connection_public_schema
      VAULT_ADDR: ${VAULT_ADDR:-http://host.docker.internal:18200}
      VAULT_APPROLE_MOUNT: ${VAULT_APPROLE_MOUNT:-approle}
      VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-pdp}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      control-api:
        condition: service_healthy
    command: ["pytest", "-q", "tests"]

volumes:
  control_postgres_data:
