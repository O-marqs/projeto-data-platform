services:
  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION}@${RUSTFS_IMAGE_DIGEST:-sha256:4ee605dfe7c6548d1fa1856357e8a1eccd929e3176acf933fafeba3ce09a69f9}
    ports:
      - "${RUSTFS_API_HOST_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_HOST_PORT:-9001}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_OBS_LOGGER_LEVEL: ${LOG_LEVEL}
    volumes:
      - fnd01_rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:9000/health && curl --fail http://127.0.0.1:9001/rustfs/console/health"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  postgres:
    image: postgres:${POSTGRES_VERSION}@${POSTGRES_IMAGE_DIGEST:-sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding UTF8 --data-checksums"
    volumes:
      - fnd01_postgres_data:/var/lib/postgresql
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/create-polaris-schema.sql:/docker-entrypoint-initdb.d/create-polaris-schema.sql:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rustfs-bucket-init:
    image: amazon/aws-cli:${AWS_CLI_VERSION}@${AWS_CLI_IMAGE_DIGEST:-sha256:e8467f2c319f9bc9a1471808a69949a76915e9c95eaf4a09ece9f9e85fd32747}
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: ${RUSTFS_REGION}
      AWS_ENDPOINT_URL: ${RUSTFS_INTERNAL_ENDPOINT}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        if ! aws s3api head-bucket --bucket "$${RUSTFS_BUCKET}" 2>/dev/null; then
          echo "Creating RustFS bucket $${RUSTFS_BUCKET}";
          aws s3 mb "s3://$${RUSTFS_BUCKET}";
        else
          echo "RustFS bucket already exists";
        fi;
        aws s3api head-bucket --bucket "$${RUSTFS_BUCKET}";
        echo "RustFS bucket ready"

  polaris-bootstrap:
    image: apache/polaris-admin-tool:${POLARIS_ADMIN_VERSION}@${POLARIS_ADMIN_IMAGE_DIGEST:-sha256:3d8a24cea57aef3b71a0d7b09e5d2278d01e7e1b30071bf6648f2a6953322cca}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=polaris_schema
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      POLARIS_REALM: ${POLARIS_REALM}
      POLARIS_ROOT_CLIENT_ID: ${POLARIS_ROOT_CLIENT_ID}
      POLARIS_ROOT_CLIENT_SECRET: ${POLARIS_ROOT_CLIENT_SECRET}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        credentials_file=/tmp/polaris-bootstrap-credentials;
        printf '{"%s":{"client-id":"%s","client-secret":"%s"}}\n' "$${POLARIS_REALM}" "$${POLARIS_ROOT_CLIENT_ID}" "$${POLARIS_ROOT_CLIENT_SECRET}" > "$${credentials_file}";
        exec /opt/jboss/container/java/run/run-java.sh bootstrap --credentials-file="$${credentials_file}"

  polaris:
    image: apache/polaris:${POLARIS_VERSION}@${POLARIS_IMAGE_DIGEST:-sha256:3495f67f38cca33892a045f7dd3f46eb52387f0fd52d4145538a772fd8aedad7}
    ports:
      - "${POLARIS_CATALOG_HOST_PORT:-8181}:8181"
      - "${POLARIS_MANAGEMENT_HOST_PORT:-8182}:8182"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-bucket-init:
        condition: service_completed_successfully
      polaris-bootstrap:
        condition: service_completed_successfully
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES: 5
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_INITIAL_DELAY_IN_MS: 100
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_DURATION_IN_MS: 5000
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=polaris_schema
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      POLARIS_REALM_CONTEXT_REALMS: ${POLARIS_REALM}
      AWS_REGION: ${RUSTFS_REGION}
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      QUARKUS_OTEL_SDK_DISABLED: "true"
      'polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES"': '["S3"]'
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 15s

  polaris-catalog-init:
    image: alpine/curl:${ALPINE_CURL_VERSION}@${ALPINE_CURL_IMAGE_DIGEST:-sha256:a39f52cab21d7e283448a9f73032dfb578ffcea9edaaa90c1d637117149b337f}
    depends_on:
      polaris:
        condition: service_healthy
    environment:
      CLIENT_ID: ${POLARIS_ROOT_CLIENT_ID}
      CLIENT_SECRET: ${POLARIS_ROOT_CLIENT_SECRET}
      POLARIS_REALM: ${POLARIS_REALM}
      POLARIS_CATALOG: ${POLARIS_CATALOG}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET}
      RUSTFS_CLIENT_ENDPOINT: ${RUSTFS_ENDPOINT}
      RUSTFS_INTERNAL_ENDPOINT: ${RUSTFS_INTERNAL_ENDPOINT}
      RUSTFS_REGION: ${RUSTFS_REGION}
      POLARIS_INTERNAL_ENDPOINT: ${POLARIS_INTERNAL_ENDPOINT}
    volumes:
      - ../../experiments/fnd01/scripts/catalog-bootstrap.sh:/usr/local/bin/catalog-bootstrap.sh:ro
    entrypoint: ["/bin/sh"]
    command: ["/usr/local/bin/catalog-bootstrap.sh"]

  spark:
    image: apache/spark:${SPARK_VERSION}@${SPARK_IMAGE_DIGEST:-sha256:f3d6eaa8bab8ec2e38f3c3918a5b2f8b253c95bcb19f9e87ad0e0cdacf9df2d5}
    profiles: ["fnd01"]
    depends_on:
      polaris-catalog-init:
        condition: service_completed_successfully
    environment:
      ICEBERG_VERSION: ${ICEBERG_VERSION}
      ICEBERG_CATALOG: ${ICEBERG_CATALOG}
      ICEBERG_NAMESPACE: ${ICEBERG_NAMESPACE}
      ICEBERG_TABLE: ${ICEBERG_TABLE}
      ICEBERG_SPARK_RUNTIME_SHA256: ${ICEBERG_SPARK_RUNTIME_SHA256:-39ea09e6c03550a300b9d9ab498949836d2d434e441da4c12a943a086e396940}
      ICEBERG_AWS_BUNDLE_SHA256: ${ICEBERG_AWS_BUNDLE_SHA256:-86bf20892ea5b4c17688f19b075399885f6aa5303f6b2dc9f491e76ceef9633b}
      POLARIS_INTERNAL_ENDPOINT: ${POLARIS_INTERNAL_ENDPOINT}
      POLARIS_REALM: ${POLARIS_REALM}
      POLARIS_CATALOG: ${POLARIS_CATALOG}
      POLARIS_ROOT_CLIENT_ID: ${POLARIS_ROOT_CLIENT_ID}
      POLARIS_ROOT_CLIENT_SECRET: ${POLARIS_ROOT_CLIENT_SECRET}
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_REGION: ${RUSTFS_REGION}
    volumes:
      - ../../experiments/fnd01/scripts/spark-entrypoint.sh:/opt/fnd01/entrypoint.sh:ro
      - ../../experiments/fnd01/scripts/verify-iceberg-artifacts.py:/opt/fnd01/verify-iceberg-artifacts.py:ro
      - ../../experiments/fnd01/src/run_fnd01.py:/opt/fnd01/run_fnd01.py:ro
    entrypoint: ["/opt/fnd01/entrypoint.sh"]
    command: ["--mode", "write-read"]

volumes:
  fnd01_rustfs_data:
    name: ${FND01_RUSTFS_VOLUME_NAME:-pdp_fnd01_rustfs_data}
  fnd01_postgres_data:
    name: ${FND01_POSTGRES_VOLUME_NAME:-pdp_fnd01_postgres_data}
